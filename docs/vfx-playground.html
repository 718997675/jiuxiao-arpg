<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>九霄 · 技能特效实验室</title>
<style>
:root{
  --gold:#d8b25a; --gold-dim:rgba(216,178,90,.28);
  --ink:#080a0f; --panel:rgba(11,14,20,.86);
  --txt:#e9e3d5; --txt-dim:#9a9384;
  --c-fire:#ff7a3c; --c-ice:#9ae8ff; --c-thunder:#ffe066;
  --c-poison:#8fd05a; --c-holy:#fff2b0; --c-phys:#ffd8a0;
  --c-blood:#e0483c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  user-select:none;-webkit-user-select:none}
canvas{display:block;position:absolute;inset:0}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- 全屏叠层 ---------- */
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.9),rgba(255,255,255,0) 60%);
  mix-blend-mode:screen}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 160px 40px rgba(200,30,30,.85)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.055;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.7'/></svg>")}

/* ---------- 顶栏 ---------- */
#top{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;
  justify-content:center;gap:18px;pointer-events:none;z-index:20;
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
#top .brand{font-family:"Songti SC","STSong",serif;font-size:14px;letter-spacing:.34em;
  color:var(--gold);opacity:.9}
#top .brand small{font-size:10px;letter-spacing:.1em;color:var(--txt-dim);margin-left:10px;
  font-family:system-ui}
#perf{display:flex;gap:14px;font-size:10.5px;color:var(--txt-dim);font-variant-numeric:tabular-nums}
#perf b{color:#cfe6c0;font-weight:500}

/* ---------- 左上角色板 ---------- */
#plate{position:absolute;left:18px;top:56px;width:322px;z-index:22;pointer-events:none}
#plate .row1{display:flex;gap:10px;align-items:center}
#portrait{width:58px;height:58px;flex:0 0 58px;border:1px solid var(--gold-dim);border-radius:3px;
  background:radial-gradient(circle at 50% 35%,#2a2118,#100c08);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-family:"Songti SC",serif;
  font-size:22px;color:var(--gold);box-shadow:0 0 14px rgba(0,0,0,.7) inset}
#portrait::after{content:"";position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(216,178,90,.16),transparent 55%)}
#plate .bars{flex:1;display:flex;flex-direction:column;gap:5px;padding-top:2px}
.bar{height:9px;border:1px solid rgba(0,0,0,.8);border-radius:1px;position:relative;overflow:hidden;
  background:rgba(0,0,0,.62);box-shadow:0 1px 0 rgba(255,255,255,.05)}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .18s ease-out}
#hp i{background:linear-gradient(180deg,#d8564a,#8e1f18)}
#mp i{background:linear-gradient(180deg,#4d8fd6,#1d3f72)}
.bar span{position:absolute;right:3px;top:-1px;font-size:8px;line-height:9px;color:#f0e6d2;
  text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.lv{font-size:9px;color:var(--gold);letter-spacing:.08em;margin-top:-1px}

/* ---------- buff 图标行（血条下方） ---------- */
#buffrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;margin-left:68px;
  min-height:30px;pointer-events:auto;align-items:flex-start}
.bf{position:relative;width:30px;height:30px;border-radius:2px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.55);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.5);
  animation:bfIn .16s ease-out}
@keyframes bfIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.bf svg{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
.bf .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,var(--c),transparent 70%);
  opacity:.28}
.bf .cd{position:absolute;left:0;bottom:0;height:2px;background:var(--c);width:100%;
  transition:width .5s linear;opacity:.9}
.bf .st{position:absolute;right:1px;bottom:1px;font-size:9px;font-weight:700;line-height:1;
  color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;font-variant-numeric:tabular-nums}
.bf .tm{position:absolute;left:0;right:0;top:-1px;text-align:center;font-size:8px;color:#fff;
  opacity:0;text-shadow:0 1px 2px #000;transition:opacity .2s}
.bf.urgent .tm{opacity:.95}
.bf.urgent .glow{animation:none;opacity:.5}
.bf.dead{animation:bfOut .14s ease-in forwards}
@keyframes bfOut{to{transform:scale(.4);opacity:0}}

/* 旧版 HUD 对照 */
#oldhud{position:absolute;left:50%;transform:translateX(-50%);bottom:158px;z-index:21;
  display:flex;gap:6px;pointer-events:none;opacity:.95}
#oldhud .ob{width:26px;height:26px;background:#c9a24a;border-radius:2px;
  animation:oldPulse .1s infinite alternate;font-size:8px;color:#111;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
@keyframes oldPulse{from{opacity:.35;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
#oldhud .tag{position:absolute;top:-15px;left:0;font-size:9px;color:#e0766a;white-space:nowrap}

/* ---------- 右侧面板 ---------- */
#panel{position:absolute;right:14px;top:56px;width:302px;z-index:22;background:var(--panel);
  border:1px solid rgba(216,178,90,.18);border-radius:3px;padding:12px 13px 14px;
  backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.55);
  max-height:calc(100vh - 200px);overflow:auto;scrollbar-width:thin}
#panel.collapsed{display:none!important}
#panelBtn{display:none}
@media (max-width:760px){
  #panelBtn{display:block;position:fixed;right:8px;top:38px;z-index:26;padding:5px 11px;
    font-size:11px;letter-spacing:.08em;border:1px solid rgba(216,178,90,.4);border-radius:2px;
    background:rgba(10,13,19,.85);color:#e8d2a0}
}
#panel::-webkit-scrollbar{width:5px}
#panel::-webkit-scrollbar-thumb{background:rgba(216,178,90,.25)}
#panel h2{font-family:"Songti SC",serif;font-size:15px;letter-spacing:.1em;color:var(--gold);
  font-weight:400;display:flex;align-items:baseline;gap:8px}
#panel h2 em{font-style:normal;font-size:10px;color:var(--txt-dim);letter-spacing:0;font-family:system-ui}
.sil{display:inline-block;margin:7px 0 5px;font-size:9.5px;letter-spacing:.06em;
  padding:2px 7px;border:1px solid var(--gold-dim);color:#e6cf9a;border-radius:2px}
.note{font-size:11px;line-height:1.6;color:var(--txt-dim)}
.note b{color:#e8dcc2;font-weight:600}
.sec{margin-top:14px;padding-top:11px;border-top:1px solid rgba(255,255,255,.07)}
.sec-t{font-size:9.5px;letter-spacing:.16em;color:#8b8474;margin-bottom:7px;text-transform:uppercase}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:5px 0;font-size:11px;border:1px solid rgba(255,255,255,.1);
  border-radius:2px;color:var(--txt-dim);background:rgba(255,255,255,.02);transition:.13s;white-space:nowrap}
.seg button:hover{border-color:var(--gold-dim);color:#e8dcc2}
.seg button.on{background:rgba(216,178,90,.16);border-color:rgba(216,178,90,.6);color:#ffe9b8;
  box-shadow:0 0 12px rgba(216,178,90,.16) inset}
.seg button.elem.on{color:#0a0a0a;font-weight:600}
.cmbtn{width:100%;text-align:left;display:flex;align-items:center;gap:8px;padding:6px 8px;
  border:1px solid rgba(255,255,255,.08);border-radius:2px;margin-bottom:5px;font-size:11px;
  color:#cfc6b2;background:rgba(255,255,255,.015);transition:.13s}
.cmbtn:hover{background:rgba(216,178,90,.1);border-color:var(--gold-dim);color:#ffecc4}
.cmbtn i{width:5px;height:5px;border-radius:50%;background:var(--c,#d8b25a);flex:0 0 5px}
.cmbtn small{margin-left:auto;font-size:9px;color:#7d7669}
.chk{display:flex;align-items:center;gap:8px;font-size:11px;color:#b9b0a0;cursor:pointer;padding:3px 0}
.chk input{appearance:none;width:28px;height:15px;border-radius:8px;background:rgba(255,255,255,.12);
  position:relative;transition:.16s;cursor:pointer;flex:0 0 28px}
.chk input:after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;
  background:#8b8474;transition:.16s}
.chk input:checked{background:rgba(216,178,90,.42)}
.chk input:checked:after{left:15px;background:#ffe0a0}

/* ---------- 技能栏 ---------- */
#barwrap{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:22;
  display:flex;flex-direction:column;align-items:center;gap:7px}
#tabs{display:flex;gap:2px;background:rgba(0,0,0,.5);padding:2px;border-radius:3px;
  border:1px solid rgba(255,255,255,.07)}
#tabs button{padding:4px 16px;font-size:11px;letter-spacing:.12em;color:#8b8474;border-radius:2px;
  font-family:"Songti SC",serif}
#tabs button.on{background:rgba(216,178,90,.16);color:#ffe9b8}
#bar{display:flex;gap:7px}
.slot{position:relative;width:60px;height:60px;border-radius:3px;overflow:hidden;
  background:linear-gradient(165deg,#1a1712,#0a0a0c);border:1px solid rgba(216,178,90,.22);
  cursor:pointer;transition:transform .1s,border-color .12s,box-shadow .12s;
  display:flex;align-items:center;justify-content:center}
.slot:hover{border-color:rgba(216,178,90,.75);transform:translateY(-3px);
  box-shadow:0 6px 18px rgba(0,0,0,.6),0 0 16px rgba(216,178,90,.14)}
.slot.on{border-color:#ffe0a0;box-shadow:0 0 18px rgba(255,210,120,.3)}
.slot svg{width:34px;height:34px;opacity:.92}
.slot .k{position:absolute;left:3px;top:2px;font-size:9px;color:#8b8474;font-variant-numeric:tabular-nums}
.slot .nm{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:9px;
  padding:1px 0 2px;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);color:#e0d5bd;
  letter-spacing:.03em}
.slot .cdsweep{position:absolute;inset:0;background:rgba(0,0,0,.62);transform-origin:top;
  transform:scaleY(0);pointer-events:none}

/* ---------- 教学提示 / 伤害数字 ---------- */
#hint{position:absolute;left:18px;bottom:18px;font-size:10.5px;color:#6f695c;line-height:1.75;
  z-index:20;pointer-events:none}
#hint b{color:#a89b80;font-weight:500}
#floats{position:absolute;inset:0;pointer-events:none;z-index:21;overflow:hidden}
.dmg{position:absolute;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 14px currentColor;will-change:transform,opacity;
  transform:translate(-50%,-50%)}
.dmg.crit{font-size:21px}
.dmg small{font-size:9px;font-weight:400;opacity:.85;margin-left:2px}

/* ---------- 开场遮罩 ---------- */
#intro{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(16,20,28,.62),rgba(5,6,10,.95) 72%);
  transition:opacity .5s}
#intro h1{font-family:"Songti SC",serif;font-size:28px;letter-spacing:.4em;color:#e8cf95;
  font-weight:400;text-indent:.4em}
#intro p{margin-top:12px;font-size:11.5px;color:#7d7669;letter-spacing:.16em}
#intro .go{margin-top:26px;padding:9px 34px;border:1px solid rgba(216,178,90,.5);color:#f0d9a4;
  font-size:12px;letter-spacing:.3em;border-radius:2px;transition:.2s;text-indent:.3em}
#intro .go:hover{background:rgba(216,178,90,.14);box-shadow:0 0 24px rgba(216,178,90,.2)}
#intro.gone{opacity:0;pointer-events:none}

@media (max-width:1180px){
  #panel{width:262px}
  #plate{width:276px}
  #hint{display:none}
}
@media (max-width:900px){
  #panel{right:8px;top:48px;width:216px;transform:scale(.92);transform-origin:top right}
  #plate{left:8px;top:48px;width:230px;transform:scale(.9);transform-origin:top left}
  .slot{width:48px;height:48px}
  .slot svg{width:26px;height:26px}
}
@media (max-width:760px){
  #top{height:36px}
  #top .brand{font-size:11px;letter-spacing:.2em}
  #top .brand small,#perf{display:none}
  #plate{left:6px;top:38px;width:214px;transform:scale(.86);transform-origin:top left}
  #panel{position:fixed;left:6px;right:6px;top:auto;bottom:96px;width:auto!important;
    max-width:none;max-height:40vh;transform:none;overflow-x:hidden;
    padding:10px 11px;background:rgba(8,10,15,.94)}
  #segElem,#segMode,#segSpeed{flex-wrap:wrap}
  #segElem button{flex:1 1 28%;padding:5px 2px}
  #panel .sec{margin-top:10px;padding-top:8px}
  .cmbtn{font-size:10.5px;padding:5px 7px}
  #panel h2{font-size:13px}
  #panel .sil{margin:5px 0 4px}
  #panel .note{font-size:10.5px;line-height:1.5}
  #barwrap{bottom:8px;gap:5px}
  #tabs button{padding:3px 12px;font-size:10px}
  .slot{width:50px;height:50px}
  .slot svg{width:27px;height:27px}
  .slot .nm{font-size:8px}
  #oldhud{bottom:150px}
  #hint{display:none}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="grain"></div>
<div id="flash"></div>
<div id="vig"></div>
<div id="floats"></div>

<div id="top">
  <div class="brand">技能特效实验室<small>VFX PLAYGROUND</small></div>
  <div id="perf"><span>FPS <b id="pfps">60</b></span><span>粒子 <b id="ppart">0</b></span><span>DrawCall <b id="pdc">0</b></span><span>重建/秒 <b id="preb">0</b></span></div>
</div>

<div id="plate">
  <div class="row1">
    <div id="portrait">刀</div>
    <div class="bars">
      <div class="lv">Lv.42 · 试炼场 · 刀客</div>
      <div class="bar" id="hp"><i style="width:78%"></i><span>780 / 1000</span></div>
      <div class="bar" id="mp"><i style="width:62%"></i><span>310 / 500</span></div>
    </div>
  </div>
  <div id="buffrow"></div>
</div>

<div id="oldhud" class="hidden"><div class="tag">旧版：每 100ms 整块重建 → 闪</div></div>

<button id="panelBtn">设置 / 对比</button>
<div id="panel">
  <h2 id="pname">旋风斩<em id="pslot">刀 · ①</em></h2>
  <div class="sil" id="psil">旋转</div>
  <div class="note" id="pnote"></div>

  <div class="sec">
    <div class="sec-t">实现版本（A / B）</div>
    <div class="seg" id="segMode">
      <button data-v="v2" class="on">新实现</button>
      <button data-v="legacy">旧实现</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-t">元素材质（只管色，不管形）</div>
    <div class="seg" id="segElem"></div>
  </div>

  <div class="sec">
    <div class="sec-t">播放速度</div>
    <div class="seg" id="segSpeed">
      <button data-v="0.25">0.25× 慢放</button>
      <button data-v="0.5">0.5×</button>
      <button data-v="1" class="on">1×</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-t">技能组合（读已有状态位触发）</div>
    <button class="cmbtn" data-cm="freeze"><i style="--c:#9ae8ff"></i>冻结 → 碎裂<small>1</small></button>
    <button class="cmbtn" data-cm="burn"><i style="--c:#8fd05a"></i>中毒 → 焚毒<small>2</small></button>
    <button class="cmbtn" data-cm="exec"><i style="--c:#e0483c"></i>破甲 → 处决<small>3</small></button>
    <button class="cmbtn" data-cm="gather"><i style="--c:#ffe066"></i>聚怪 → 塌陷冲击<small>4</small></button>
  </div>

  <div class="sec">
    <div class="sec-t">对比与调试</div>
    <button class="cmbtn" id="btnAB"><i style="--c:#e8cf95"></i>A / B 连播对比<small>1.7s 后自动换</small></button>
    <label class="chk"><input type="checkbox" id="optOld">显示旧版 HUD（会闪）</label>
    <label class="chk"><input type="checkbox" id="optAuto">自动巡演（2.4s 换一个）</label>
    <label class="chk"><input type="checkbox" id="optSlowmo">受击顿帧 / 震屏</label>
  </div>
</div>

<div id="barwrap">
  <div id="tabs">
    <button data-c="blade" class="on">刀客</button>
    <button data-c="mage">法师</button>
    <button data-c="tao">道士</button>
  </div>
  <div id="bar"></div>
</div>

<div id="hint">
  <b>左键点地面</b> 移动　<b>1–5</b> 放技能　<b>Q</b> 切换实现　<b>空格</b> 暂停<br>
  <b>1</b>–<b>4</b> 也可触发右侧技能组合
</div>

<div id="intro">
  <h1>技能特效实验室</h1>
  <p>同一个技能，切换「旧实现 / 新实现」看差别</p>
  <p style="margin-top:6px;color:#5f5a50;letter-spacing:.08em">进入后点技能块，或用 1–5 释放 · Q 切换新旧 · 放慢到 0.25× 看得最清</p>
  <button class="go" id="startBtn">进 入</button>
</div>

<!-- three.js 兜底加载：docs/ 作为站点根、file:// 双击、项目根作为站点根 三种打开方式都能命中 -->
<script src="./three.min.js"></script>
<script>
if(!window.THREE){
  document.write('<script src="../lib/three.min.js"><\/script>');
}
</script>
<script>
/* =====================================================================
   0-A. 启动自检（先把失败原因摆到脸上，避免"点了没反应"）
   ===================================================================== */
function _bootFail(title, detail){
  const el = document.getElementById('intro');
  if(!el) return;
  el.innerHTML = '<h1 style="font-family:system-ui;font-size:26px;letter-spacing:.2em;color:#e8b45a">'
    + title + '</h1>'
    + '<p style="font-family:system-ui;font-size:13px;line-height:1.9;color:#9a9184;max-width:560px">'
    + detail + '</p>';
  el.style.background = 'radial-gradient(circle at 50% 45%,#1a1410,#07070a 72%)';
}
addEventListener('error', function(e){
  document.title = 'ERR: ' + (e.message || 'unknown');
  _bootFail('启动失败', (e.message || '脚本报错') + '<br><span style="color:#6b6459">'
    + (e.filename || '').split('/').pop() + ':' + e.lineno + '</span>');
});
if(!window.THREE){
  _bootFail('three.js 没加载到',
    '页面找不到 three.js，脚本无法启动。<br>'
    + '请确认 <b>docs/three.min.js</b> 与页面在同一目录（本项目已内置）。<br>'
    + '<span style="color:#6b6459">如果直接双击打开，也请确认 lib/three.min.js 存在。</span>');
  throw new Error('THREE not loaded');
}

/* =====================================================================
   0. 引擎底座
   ===================================================================== */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05070b, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070b, 0.026);

const CAM = { pitch: 50 * Math.PI/180, dist: 9.9, base: new THREE.Vector3() };
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 120);
function placeCamera(){
  const h = Math.sin(CAM.pitch) * CAM.dist;
  const z = Math.cos(CAM.pitch) * CAM.dist;
  CAM.base.set(0, h, z * 0.86);
  camera.position.copy(CAM.base);
  camera.lookAt(0, 0.9, 0);
}
placeCamera();

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x0a0a0c, 0.55));
const key = new THREE.DirectionalLight(0xffe2b0, 0.85); key.position.set(-5, 9, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x5a7ea8, 0.5); rim.position.set(6, 5, -7); scene.add(rim);

function fitCamera(){
  const asp = innerWidth / innerHeight;
  CAM.dist = asp < 0.85 ? 14.5 : (asp < 1.3 ? 11.6 : 9.9);
  camera.fov = asp < 0.85 ? 52 : 42;
  camera.aspect = asp;
  camera.updateProjectionMatrix();
  placeCamera();
}
fitCamera();
addEventListener('resize', ()=>{
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
  updatePointScale();
});

function cv(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}
function radial(g, w, h, stops, cx = w/2, cy = h/2, r = w/2){
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
  stops.forEach(s => gr.addColorStop(s[0], s[1]));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}

/* =====================================================================
   2. 粒子池（单贴图 = 单材质 = 一批 draw call）
   ===================================================================== */
const U = { scale: { value: 400 } };
function updatePointScale(){
  U.scale.value = renderer.domElement.height * 0.5;
}

const POINT_VS = `
uniform float uScale;
attribute float aSize; attribute float aAlpha; attribute float aRot; attribute vec3 aTint;
varying float vA; varying float vR; varying vec3 vC;
void main(){
  vA = aAlpha; vR = aRot; vC = aTint;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_PointSize = aSize * uScale / max(0.001, -mv.z);
  gl_Position = projectionMatrix * mv;
}`;

const POINT_FS = `
uniform sampler2D uTex; varying float vA; varying float vR; varying vec3 vC;
void main(){
  vec2 uv = gl_PointCoord - 0.5;
  float c = cos(vR), s = sin(vR);
  uv = vec2(uv.x*c - uv.y*s, uv.x*s + uv.y*c) + 0.5;
  vec4 t = texture2D(uTex, uv);
  gl_FragColor = vec4(vC * t.rgb, t.a * vA);
  if(gl_FragColor.a < 0.004) discard;
}`;

const _c = new THREE.Color();
class Pool {
  constructor(tex, max = 900){
    this.max = max; this.cursor = 0; this.alive = 0;
    const g = new THREE.BufferGeometry();
    this.aPos = new Float32Array(max * 3);
    this.aSize = new Float32Array(max);
    this.aAlpha = new Float32Array(max);
    this.aRot = new Float32Array(max);
    this.aTint = new Float32Array(max * 3);
    g.setAttribute('position', new THREE.BufferAttribute(this.aPos, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(this.aSize, 1));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(this.aAlpha, 1));
    g.setAttribute('aRot', new THREE.BufferAttribute(this.aRot, 1));
    g.setAttribute('aTint', new THREE.BufferAttribute(this.aTint, 3));
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 60);
    const m = new THREE.ShaderMaterial({
      uniforms:{ uTex:{ value: tex }, uScale: U.scale },
      vertexShader: POINT_VS, fragmentShader: POINT_FS,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    this.pts = new THREE.Points(g, m);
    this.pts.frustumCulled = false;
    scene.add(this.pts);
    this.p = [];  // 粒子对象池
    for(let i=0;i<max;i++) this.p.push({ live:false, x:0,y:0,z:0, vx:0,vy:0,vz:0, t:0, life:1,
      s0:1, s1:1, a0:1, grav:0, drag:0, rot:0, rotV:0, cx:0,cy:0,cz:0, spin:0 });
  }
  spawn(o){
    const p = this.p[this.cursor];
    this.cursor = (this.cursor + 1) % this.max;
    p.live = true; p.t = 0;
    p.x = o.x; p.y = o.y; p.z = o.z;
    p.vx = o.vx||0; p.vy = o.vy||0; p.vz = o.vz||0;
    p.life = o.life || 0.6;
    p.s0 = o.s0 != null ? o.s0 : 0.4;
    p.s1 = o.s1 != null ? o.s1 : p.s0 * 0.2;
    p.a0 = o.a0 != null ? o.a0 : 1;
    p.grav = o.grav || 0; p.drag = o.drag || 0;
    p.rot = o.rot || 0; p.rotV = o.rotV || 0;
    p.cx = o.r != null ? o.r : 1; p.cy = o.g != null ? o.g : 1; p.cz = o.b != null ? o.b : 1;
    p.wob = o.wob || 0;
    return p;
  }
  update(dt){
    const P = this.p, pos = this.aPos, sz = this.aSize, al = this.aAlpha, ro = this.aRot, ti = this.aTint;
    let n = 0;
    for(let i=0;i<this.max;i++){
      const p = P[i];
      if(!p.live){ sz[i] = 0; al[i] = 0; continue; }
      p.t += dt;
      const k = p.t / p.life;
      if(k >= 1){ p.live = false; sz[i] = 0; al[i] = 0; continue; }
      if(p.drag) { const d = Math.max(0, 1 - p.drag*dt); p.vx *= d; p.vy *= d; p.vz *= d; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.rot += p.rotV * dt;
      const e = 1 - Math.pow(1-k, 2.2);              // 缓出
      const fadeIn = Math.min(1, k / 0.08);
      const fadeOut = 1 - Math.pow(k, 2.4);
      pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = p.z;
      sz[i] = (p.s0 + (p.s1 - p.s0) * e) * (0.85 + 0.15*Math.sin(p.rot*3));
      al[i] = p.a0 * fadeIn * fadeOut;
      ro[i] = p.rot;
      ti[i*3] = p.cx; ti[i*3+1] = p.cy; ti[i*3+2] = p.cz;
      n++;
    }
    this.alive = n;
    const g = this.pts.geometry;
    g.attributes.position.needsUpdate = true;
    g.attributes.aSize.needsUpdate = true;
    g.attributes.aAlpha.needsUpdate = true;
    g.attributes.aRot.needsUpdate = true;
    g.attributes.aTint.needsUpdate = true;
  }
}

const POOLS = {};
function pool(name){
  if(!POOLS[name]) POOLS[name] = new Pool(TEX[name] || TEX.soft, 1100);

function totalParticles(){
  let n = 0; for(const k in POOLS) n += POOLS[k].alive; return n;

const TIME = { t: 0, dt: 0, raw: 0, scale: 1, pause: false, stop: 0 };
const updaters = [];
function addUpdate(o){ updaters.push(o); return o; }

// 简易时间轴：seq([[delay, fn], ...])
function seq(steps){
  let i = 0, acc = 0;
  const list = steps.slice().sort((a,b)=>a[0]-b[0]);
  return addUpdate({
    dead: false,
    update(dt){
      if(this.dead) return;
      acc += dt;
      while(i < list.length && acc >= list[i][0]){
        const fn = list[i][1]; i++;
        if(typeof fn === 'function') fn();
      }
      if(i >= list.length){ this.dead = true; }
    }
  });
}
function delay(sec, fn){ return seq([[sec, fn]]); }

// ---- 刀气弧（父级绕 Y 转 / 子级只管倾斜） ----
const arcGeos = {};
function arcGeometry(inner, outer, span, seg = 44){
  const k = inner.toFixed(2)+'_'+outer.toFixed(2)+'_'+span.toFixed(2);
  if(arcGeos[k]) return arcGeos[k];
  const pos = [], uv = [], idx = [];
  for(let i=0;i<=seg;i++){
    const t = i/seg, a = -span/2 + span*t, ca = Math.cos(a), sa = Math.sin(a);
    pos.push(ca*inner, sa*inner, 0); uv.push(t, 0);
    pos.push(ca*outer, sa*outer, 0); uv.push(t, 1);
  }
  for(let i=0;i<seg;i++){ const b = i*2; idx.push(b, b+1, b+2, b+1, b+3, b+2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 6);
  arcGeos[k] = g;
  return g;
}
function arcMaterial(color, opacity = 1){
  return new THREE.MeshBasicMaterial({ map: TEX.slash, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false });
}

/**
 * 刀气弧
 * opt: { r, inner, span, tilt, y, spin, sweep, life, color, from, to }
 *  spin  每秒绕 Y 旋转弧度；sweep 在平面内扫过的弧度（用于定向挥砍）
 */
FX.arc = function(center, opt = {}){
  const r = opt.r || 1.7;
  const inner = opt.inner != null ? opt.inner : r * 0.62;
  const span = opt.span || 2.1;
  const tilt = opt.tilt != null ? opt.tilt : 0.62;
  const life = opt.life || 0.36;
  const col = opt.color != null ? opt.color : C(E().glow);

  const spinG = new THREE.Group();
  spinG.position.set(center.x, opt.y != null ? opt.y : 0.95, center.z);
  spinG.rotation.y = opt.yaw || 0;
  scene.add(spinG);

  const tiltG = new THREE.Group();
  tiltG.rotation.x = -Math.PI/2 + tilt;
  spinG.add(tiltG);

  const geo = arcGeometry(inner, r, span);
  const mkArc = (matInner, matOuter, op) => {
    const m1 = new THREE.Mesh(geo, matOuter);
    const m2 = new THREE.Mesh(arcGeometry(inner*1.02, r*0.82, span*0.96), matInner);
    m2.position.z = 0.012;
    tiltG.add(m1); tiltG.add(m2);
    return [m1, m2];
  };
  const outerMat = arcMaterial(col, opt.opacity || 0.95);
  const innerMat = arcMaterial(C(E().core), 0.9);
  const [mOut, mIn] = mkArc(innerMat, outerMat);

  const sweepFrom = opt.from != null ? opt.from : 0;
  const sweepTo = opt.to != null ? opt.to : 0;
  const spin = opt.spin || 0;

  addUpdate({ t:0, update(dt){
    this.t += dt;
    const k = Math.min(1, this.t/life);
    spinG.rotation.y += spin * dt;
    if(sweepTo !== sweepFrom){
      const e = 1 - Math.pow(1-k, 3);
      mOut.rotation.z = mIn.rotation.z = sweepFrom + (sweepTo - sweepFrom) * e;
    }
    const fade = 1 - Math.pow(k, 1.6);
    outerMat.opacity = fade * (opt.opacity || 0.95);
    innerMat.opacity = fade * 0.85;
    // 前 80% 时间轻微外扩
    const sc = 1 + k*0.12;
    tiltG.scale.setScalar(sc);
    if(k >= 1){
      scene.remove(spinG);
      outerMat.dispose(); innerMat.dispose();
      this.dead = true;
    }
  }});

  // 拖尾余影：沿弧外沿撒粒子
  if(Q() > 0.55){
    for(let i=0;i<8;i++){
      const a = -span/2 + Math.random()*span;
      FX.spr(center.x + Math.cos(a)*r*0.9, (opt.y||0.95) + Math.sin(a)*tilt*0.3, center.z + Math.sin(a)*r*0.9, {
        tex:'spark', life: .25 + Math.random()*.2, s0: .16, s1: 0,
        vx: 0, vy: .5, vz: 0, a0: .8, grav: 0,
        r: C(E().core).r, g: C(E().core).g, b: C(E().core).b
      });
    }
  }
  return spinG;
};

// ---- 折线闪电（带分叉，宽面带子，不是 1px Line） ----
class Bolt {
  constructor(a, b, o = {}){
    this.a = a.clone(); this.b = b.clone();
    this.color = o.color != null ? o.color : C(E().glow);
    this.width = o.width || 0.09;
    this.seg = o.seg || 16;
    this.chaos = o.chaos != null ? o.chaos : 0.55;
    this.life = o.life || 0.18;
    this.t = 0; this.flick = 0;
    const n = this.seg;
    const g = new THREE.BufferGeometry();
    this.posArr = new Float32Array(n*2*3);
    this.alphaArr = new Float32Array(n*2);
    const uvArr = new Float32Array(n*2*2);
    const idx = [];
    for(let i=0;i<n;i++){
      uvArr[i*4] = i/(n-1); uvArr[i*4+1] = 0;
      uvArr[i*4+2] = i/(n-1); uvArr[i*4+3] = 1;
    }
    for(let i=0;i<n-1;i++){ const q = i*2; idx.push(q, q+1, q+2, q+1, q+3, q+2); }
    g.setAttribute('position', new THREE.BufferAttribute(this.posArr, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uvArr, 2));
    g.setAttribute('aA', new THREE.BufferAttribute(this.alphaArr, 1));
    g.setIndex(idx);
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 40);
    this.geo = g;
    this.mat = new THREE.ShaderMaterial({
      uniforms:{ uColor:{ value: new THREE.Color(this.color) }, uTex:{ value: TEX.beam }, uOp:{ value: 1 } },
      vertexShader:`attribute float aA; varying float vA; varying vec2 vUv;
        void main(){ vA=aA; vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`uniform vec3 uColor; uniform sampler2D uTex; uniform float uOp;
        varying float vA; varying vec2 vUv;
        void main(){ vec4 t=texture2D(uTex,vUv); float a=t.a*vA*uOp;
          if(a<0.01) discard;
          gl_FragColor=vec4(uColor, a); }`,
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide
    });
    this.mesh = new THREE.Mesh(g, this.mat);
    this.mesh.frustumCulled = false;
    scene.add(this.mesh);
    this.regen();
    this.points = null;
  }
  makePts(){
    const n = this.seg, pts = [];
    const dir = _tmpA.copy(this.b).sub(this.a);
    const len = dir.length();
    dir.normalize();
    const perp1 = new THREE.Vector3(0,1,0);
    if(Math.abs(dir.y) > 0.9) perp1.set(1,0,0);
    const p1 = perp1.cross(dir).normalize();
    const p2 = new THREE.Vector3().crossVectors(dir, p1).normalize();
    let acc = 1;
    for(let i=0;i<n;i++){
      const t = i/(n-1);
      const env = Math.sin(t*Math.PI);           // 两端固定
      const amp = len * this.chaos * 0.14 * env;
      acc = Math.max(0.3, acc * 0.72);
      const ox = (Math.random()-0.5) * amp * acc * 2;
      const oy = (Math.random()-0.5) * amp * acc * 2;
      pts.push(new THREE.Vector3().copy(this.a)
        .addScaledVector(dir, len*t)
        .addScaledVector(p1, ox)
        .addScaledVector(p2, oy));
    }
    return pts;
  }
  regen(){
    const pts = this.makePts();
    this.points = pts;
    camera.getWorldDirection(_camDir);
    const n = this.seg, pa = this.posArr, aa = this.alphaArr;
    for(let i=0;i<n;i++){
      const prev = pts[Math.max(0,i-1)], next = pts[Math.min(n-1,i+1)];
      const tan = _tmpB.copy(next).sub(prev).normalize();
      const side = new THREE.Vector3().crossVectors(tan, _camDir).normalize()
        .multiplyScalar(this.width * (0.32 + Math.sin(i/(n-1)*Math.PI) * 0.9));
      pa[i*6]   = pts[i].x + side.x; pa[i*6+1] = pts[i].y + side.y; pa[i*6+2] = pts[i].z + side.z;
      pa[i*6+3] = pts[i].x - side.x; pa[i*6+4] = pts[i].y - side.y; pa[i*6+5] = pts[i].z - side.z;
      const fade = Math.sin(i/(n-1)*Math.PI) * 0.55 + 0.55;
      aa[i*2] = fade; aa[i*2+1] = fade;
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.aA.needsUpdate = true;
  }
  update(dt){
    this.t += dt; this.flick -= dt;
    if(this.flick <= 0 && this.t < this.life*0.72){ this.flick = 0.035; this.regen(); }
    this.mat.uniforms.uOp.value = Math.max(0, 1 - Math.pow(this.t/this.life, 1.5));
    if(this.t >= this.life){ this.dispose(); return false; }
    return true;
  }
  dispose(){ scene.remove(this.mesh); this.geo.dispose(); this.mat.dispose(); }
}
FX.bolt = function(a, b, o = {}){
  const main = new Bolt(a, b, o);
  const list = [main];
  addUpdate({ update(dt){
    for(let i=list.length-1;i>=0;i--){ if(!list[i].update(dt)) list.splice(i,1); }
    if(!list.length) this.dead = true;
  }});
  // 分叉
  const extra = o.branch != null ? o.branch : 2;
  if(Q() > 0.35){
    for(let i=0;i<extra;i++){
      const t = 0.25 + Math.random()*0.5;
      const from = main.points ? main.points[Math.floor(main.seg*t)] : _tmpA.copy(a).lerp(b, t).clone();
      const off = new THREE.Vector3((Math.random()-.5)*2.2, (Math.random()-.5)*1.4, (Math.random()-.5)*2.2);
      const br = new Bolt(from, from.clone().addScaledVector(b.clone().sub(a).normalize(), 0.5 + Math.random()*1.2).add(off), {
        color: o.color, width: (o.width||0.09)*0.55, seg: 8, chaos: 0.7, life: (o.life||0.18)*0.7
      });

    }
  }
  return main;
};

// ---- 领域（地面纹 + 边界墙 + 体积柱 + 脉冲） ----
FX.field = function(pos, o = {}){
  const R = o.r || 3.2;
  const life = o.life || 4.5;
  const texName = o.tex || 'sigil';
  const col = o.color != null ? o.color : C(E().glow);
  const grp = new THREE.Group();
  grp.position.set(pos.x, 0, pos.z);
  scene.add(grp);

  // 地面法阵
  const sig = new THREE.Mesh(_plane, new THREE.MeshBasicMaterial({ map: TEX[texName], color: col,
    transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  sig.rotation.x = -Math.PI/2; sig.position.y = 0.02;
  sig.scale.setScalar(R*2);
  grp.add(sig);

  // 体积柱
  const colGeo = new THREE.CylinderGeometry(R*0.92, R*0.92, 2.6, 32, 1, true);
  const colMat = new THREE.MeshBasicMaterial({ map: TEX.beam, color: col, transparent: true,
    opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false });
  const colMesh = new THREE.Mesh(colGeo, colMat);
  colMesh.position.y = 1.3; colMesh.rotation.y = Math.PI/2;
  grp.add(colMesh);

  // 边界墙（两层反向旋转）
  const wallGeo = new THREE.CylinderGeometry(R, R, 1.5, 40, 1, true);
  const walls = [];
  [1,-1].forEach((s)=>{
    const m = new THREE.Mesh(wallGeo, new THREE.MeshBasicMaterial({ map: TEX.beam, color: col,
      transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide, fog: false }));
    m.position.y = 0.55; m.rotation.y = Math.PI/2;
    m.userData.s = s;
    grp.add(m); walls.push(m);
  });

  let t = 0, pulseT = 0;
  addUpdate({ update(dt){
    t += dt; pulseT += dt;
    const k = Math.min(1, t/life);
    // 入场
    const inK = Math.min(1, t/0.35);
    const outK = k > 0.85 ? 1 - (k-0.85)/0.15 : 1;
    const e = 1 - Math.pow(1-inK, 3);
    sig.material.opacity = 0.85 * e * outK;
    sig.scale.setScalar(R*2 * (0.55 + e*0.45));
    sig.rotation.z += dt * 0.22;
    colMat.opacity = 0.10 * e * outK * (0.8 + 0.2*Math.sin(t*3));
    colMesh.rotation.y += dt * 0.35;
    walls.forEach(w=>{
      w.material.opacity = 0.20 * e * outK * (0.75 + 0.25*Math.sin(t*5 + w.userData.s));
      w.rotation.y += dt * 0.55 * w.userData.s;
    });
    // 边界升起的粒子
    if(Math.random() < dt*40 * Q()){
      const a = Math.random()*Math.PI*2;
      FX.spr(pos.x + Math.cos(a)*R, 0.05, pos.z + Math.sin(a)*R, {
        tex:'spark', life: 0.9, s0: 0.16, s1: 0, vy: 1.4, a0: 0.8, grav: -0.4,
        r: col.r, g: col.g, b: col.b
      });
    }
    // 脉冲
    if(pulseT > (o.pulse || 1.6)){
      pulseT = 0;
      FX.shock(pos, R*1.02, { color: col, dur: 0.55 });
      if(o.onPulse) o.onPulse();
    }
    if(k >= 1){ scene.remove(grp); colGeo.dispose(); wallGeo.dispose(); this.dead = true; }
  }});
  return grp;
};

// ---- 地裂 / 落雷 / 火柱：竖直喷发柱 ----
FX.geyser = function(pos, o = {}){
  const h = o.h || 3.2;
  const wScale = o.w || 1;
  const maxOp = o.opacity != null ? o.opacity : 0.95;
  const life = o.life || 0.6;
  const col = o.color != null ? C(o.color) : C(E().glow);
  const texName = o.tex || 'beam';
  const grp = new THREE.Group();
  grp.position.set(pos.x, 0, pos.z);
  scene.add(grp);
  const planes = [];
  const N = Q() > 0.55 ? 3 : 1;
  for(let i=0;i<N;i++){
    const m = new THREE.Mesh(_plane, new THREE.MeshBasicMaterial({
      map: TEX[texName], color: col, transparent: true, opacity: 0,
      depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false }));
    m.position.y = h*0.5;
    m.rotation.y = i * Math.PI / N;
    grp.add(m); planes.push(m);
  }
  const flash = flatMesh(TEX.soft, col, THREE.AdditiveBlending, 0);
  flash.position.set(pos.x, 0.04, pos.z);
  flash.scale.setScalar(2.2);

  let t = 0;
  addUpdate({ update(dt){
    t += dt;
    const k = Math.min(1, t/life);
    const grow = 1 - Math.pow(1 - Math.min(1, t/0.12), 3);
    const fade = 1 - Math.pow(k, 2.2);
    planes.forEach(p=>{
      p.scale.set((0.9 + k*0.7) * wScale, h*grow, 1);
      p.position.y = h*grow*0.5;
      p.material.opacity = maxOp * fade;
    });
    flash.material.opacity = 0.85 * (1-k);
    flash.scale.setScalar(2.2 + k*1.6);
    if(k >= 1){ scene.remove(grp); scene.remove(flash); this.dead = true; }
  }});
  return grp;
};

// ---- 拖尾丝带 ----
class Ribbon {
  constructor(o = {}){
    this.n = o.segs || 18;
    this.width = o.width || 0.35;
    this.color = new THREE.Color(o.color != null ? o.color : E().glow);
    this.tex = o.tex || TEX.slash;
    this.life = o.life || 0.45;
    this.hist = [];
    const g = new THREE.BufferGeometry();
    this.posArr = new Float32Array(this.n*2*3);
    this.alphaArr = new Float32Array(this.n*2);
    const uvArr = new Float32Array(this.n*2*2);
    for(let i=0;i<this.n;i++){ uvArr[i*4]=i/(this.n-1); uvArr[i*4+1]=0; uvArr[i*4+2]=i/(this.n-1); uvArr[i*4+3]=1; }
    const idx = [];
    for(let i=0;i<this.n-1;i++){ const q=i*2; idx.push(q,q+1,q+2,q+1,q+3,q+2); }
    g.setAttribute('position', new THREE.BufferAttribute(this.posArr, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uvArr, 2));
    g.setAttribute('aA', new THREE.BufferAttribute(this.alphaArr, 1));
    g.setIndex(idx);
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 60);
    this.geo = g;
    this.mat = new THREE.ShaderMaterial({
      uniforms:{ uColor:{ value: this.color }, uTex:{ value: this.tex }, uOp:{ value: 1 } },
      vertexShader:`attribute float aA; varying float vA; varying vec2 vUv;
        void main(){ vA=aA; vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`uniform vec3 uColor; uniform sampler2D uTex; uniform float uOp;
        varying float vA; varying vec2 vUv;
        void main(){ vec4 t=texture2D(uTex,vUv); float a=t.a*vA*uOp;
          if(a<0.01) discard; gl_FragColor=vec4(uColor, a); }`,
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide
    });
    this.mesh = new THREE.Mesh(g, this.mat);
    this.mesh.frustumCulled = false;
    scene.add(this.mesh);
  }
  push(p){ this.hist.unshift(p.clone()); if(this.hist.length > this.n) this.hist.pop(); }
  update(dt, head){
    this.t = (this.t||0) + dt;
    if(head) this.push(head);
    camera.getWorldDirection(_camDir);
    const H = this.hist, n = this.n, pa = this.posArr, aa = this.alphaArr;
    for(let i=0;i<n;i++){
      const p = H[Math.min(i, H.length-1)];
      const prev = H[Math.min(Math.max(0,i-1), H.length-1)];
      const next = H[Math.min(i+1, H.length-1)];
      if(!p){ pa.fill(0); aa.fill(0); continue; }
      const tan = _tmpA.copy(next).sub(prev);
      if(tan.lengthSq() < 1e-6) tan.set(0,0,1);
      tan.normalize();
      const side = _tmpB.crossVectors(tan, _camDir).normalize().multiplyScalar(this.width * (1 - i/n) * 0.5);
      pa[i*6]=p.x+side.x; pa[i*6+1]=p.y+side.y; pa[i*6+2]=p.z+side.z;
      pa[i*6+3]=p.x-side.x; pa[i*6+4]=p.y-side.y; pa[i*6+5]=p.z-side.z;
      const a = (1 - i/n) * (i < H.length ? 1 : 0);
      aa[i*2]=a; aa[i*2+1]=a;
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.aA.needsUpdate = true;
    this.mat.uniforms.uOp.value = Math.max(0, 1 - this.t/this.life);
    if(this.t >= this.life){ this.destroy(); return false; }
    return true;
  }
  destroy(){ scene.remove(this.mesh); this.geo.dispose(); this.mat.dispose(); }
}

const _hv = new THREE.Vector3();
function hitEnemy(e, dmg = 0, o = {}){
  if(!e || e.deadT > 0) return;
  e.hp -= dmg;
  e.hitT = 0.2;
  e.mat.emissive = e.mat.emissive || new THREE.Color(0x000000);
  e.mat.emissive.setHex(o.hitColor != null ? o.hitColor : 0xffb070);
  e.mat.emissiveIntensity = 0.55;
  if(o.kb){
    const d = _hv.copy(e.pos).sub(o.from || P.pos).setY(0);
    if(d.lengthSq() > 1e-4){ d.normalize(); e.pos.addScaledVector(d, o.kb); }
  }
  if(dmg > 0) damageNumber(_hv.set(e.pos.x, 1.4, e.pos.z), Math.round(dmg), o.color || '#ffe6b0', o.crit);
  if(e.hp <= 0) killEnemy(e);
}
function hitArea(pos, radius, dmg, o = {}){
  const hit = [];
  enemies.forEach(e=>{
    if(e.deadT > 0) return;
    const d = Math.hypot(e.pos.x - pos.x, e.pos.z - pos.z);
    if(d <= radius) hit.push(e);
  });
  hit.forEach((e,i)=>{
    const crit = Math.random() < (o.critChance || 0.18);
    hitEnemy(e, dmg * (crit ? 1.8 : 1), Object.assign({}, o, { crit }));
  });
  return hit;
}
function killEnemy(e){
  e.deadT = 1.2;
  e.hp = 0;
  FX.burst(_hv.set(e.pos.x, 0.9, e.pos.z), { n: 26, speed: 5, life: .8, size: .35, up: 1.6 });
  FX.decal(e.pos, E().decal || 'scorch', 1.4, 3, 0x111111);
  delay(1.3, ()=>{
    e.hp = e.maxHp; e.deadT = 0; e.pos.copy(e.home); e.mat.emissiveIntensity = 0;
  });
}

FX.projectile = function(o){
  const from = o.from.clone(), to = o.to.clone();
  const core = billMesh(o.tex || TEX.soft, o.color != null ? o.color : C(E().core), 1);
  core.scale.setScalar(o.size || 0.9);
  const glow = billMesh(TEX.soft, o.glow != null ? o.glow : C(E().glow), .55);
  glow.scale.setScalar((o.size || 0.9) * 2.1);
  const pts = [];
  const rib = new Ribbon({ width: o.trailWidth || 0.55, color: o.color != null ? o.color : C(E().core), life: 0.5, segs: 16 });
  let t = 0;
  const speed = o.speed || 16;
  const dist = from.distanceTo(to);
  const dur = Math.max(0.08, dist / speed);
  addUpdate({ update(dt){
    t += dt;
    const k = Math.min(1, t/dur);
    const p = _tmpA.copy(from).lerp(to, k);
    p.y += Math.sin(k*Math.PI) * (o.arc || 0.9);
    core.position.copy(p); glow.position.copy(p);
    core.scale.setScalar((o.size||0.9) * (1 + Math.sin(t*30)*0.08));
    rib.push(p);
    rib.update(dt);
    // 沿路撒火星
    if(Math.random() < dt*50){
      FX.spr(p.x, p.y, p.z, { tex: E().tex, life: .4, s0: .22, s1: 0, a0: .8,
        vx: (Math.random()-.5)*1.2, vy: (Math.random()-.5)*1.2, vz: (Math.random()-.5)*1.2, grav: E().grav });
    }

const ctxOf = (aim) => ({ x: P.pos.x, z: P.pos.z, tx: aim.x, tz: aim.z,
  dir: Math.atan2(aim.x - P.pos.x, aim.z - P.pos.z), aim });

function spinPlayer(dur = 0.9, speed = 13){
  addUpdate({ t:0, update(dt){
    this.t += dt;
    playerBody.rotation.y += speed * dt;
    if(this.t >= dur){ playerBody.rotation.y = 0; this.dead = true; }
  }});
}
function swingArm(){
  const pivot = playerBody.userData.armPivot;
  addUpdate({ t:0, update(dt){
    this.t += dt; const k = Math.min(1, this.t/0.24);
    pivot.rotation.x = -1.1 + k * 2.4;
    pivot.rotation.z = -0.5 + k * 1.1;
    if(k >= 1){ pivot.rotation.x = 0; pivot.rotation.z = 0; this.dead = true; }
  }});
}
function lunge(dist = 0.6){
  const from = P.pos.clone();
  const to = from.clone().add(new THREE.Vector3(Math.sin(P.face), 0, Math.cos(P.face)).multiplyScalar(dist));
  addUpdate({ t:0, update(dt){
    this.t += dt; const k = Math.min(1, this.t/0.16);
    P.pos.lerpVectors(from, to, k);
    if(k >= 1) this.dead = true;
  }});
}

  if(b){

    b.stacks = Math.min(9, b.stacks + (stacks - 1 > 0 ? stacks - 1 : 0));
    if(stacks > 1) b.stacks = Math.min(9, b.stacks);
    b.stEl.textContent = b.stacks > 1 ? b.stacks : '';
    return;
  }
  const el = document.createElement('div');
  el.className = 'bf';
  el.style.setProperty('--c', def.color);
  el.innerHTML =
    '<div class="glow"></div>' +
    '<svg viewBox="0 0 24 24" fill="' + def.color + '" opacity=".95"><path d="' + def.icon + '"/></svg>' +
    '<span class="cd" style="width:100%"></span>' +
    '<span class="st"></span>' +
    '<span class="tm"></span>';
  el.title = def.name;
  buffRowEl.appendChild(el);
  b = { key, def, left: dur, max: dur, stacks, el,
        cdEl: el.querySelector('.cd'), stEl: el.querySelector('.st'), tmEl: el.querySelector('.tm'),
        lastW: 100 };
  activeBuffs.set(key, b);
  // 入场动画只播一次
}

function removeBuff(key){
  const b = activeBuffs.get(key); if(!b) return;
  b.el.classList.add('dead');
  const el = b.el;
  setTimeout(()=>el.remove(), 150);
  activeBuffs.delete(key);
}

let buffTick = 0;
function updateBuffs(dt){
  buffTick += dt;
  activeBuffs.forEach((b, key)=>{
    b.left -= dt;
    if(b.left <= 0){ removeBuff(key); return; }
    // 每 0.5s 写一次宽度，靠 CSS 线性过渡补间 —— 不是每帧重建 DOM
    if(buffTick > 0.5){
      const w = Math.max(0, Math.min(100, b.left / b.max * 100));
      if(Math.abs(w - b.lastW) > 0.5){
        b.cdEl.style.width = w.toFixed(1) + '%';
        b.lastW = w;
      }
    }
    const urgent = b.left <= 3;
    if(urgent !== b.urgent){
      b.urgent = urgent;
      b.el.classList.toggle('urgent', urgent);
    }
    if(urgent) b.tmEl.textContent = Math.ceil(b.left);
  });
  if(buffTick > 0.5) buffTick = 0;
}

function aimPoint(){
  let best = null, bd = 1e9;
  enemies.forEach(e=>{
    if(e.deadT > 0) return;
    const d = Math.hypot(e.pos.x - P.pos.x, e.pos.z - P.pos.z);
    if(d < bd){ bd = d; best = e; }
  });
  if(best && bd < 6.5) return new THREE.Vector3(best.pos.x, 0, best.pos.z);
  return P.pos.clone().add(new THREE.Vector3(Math.sin(P.face), 0, Math.cos(P.face)).multiplyScalar(3.4));
}

const ray = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const mouse = new THREE.Vector2();
function screenToGround(cx, cy){
  mouse.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const p = new THREE.Vector3();
  ray.ray.intersectPlane(groundPlane, p);
  return p;
}

// 主循环
let lastT = performance.now();
let perfT = 0, frameCount = 0, autoT = 0, autoIdx = 0;
const _mv = new THREE.Vector3();

let FROZEN = false;
function simulate(raw){
  now += raw;
  const stopping = TIME.stop > 0;
  if(stopping) TIME.stop -= raw;
  const dt = TIME.pause ? 0 : (stopping ? 0 : raw * TIME.scale);

  // 玩家移动
  _mv.copy(P.target).sub(P.pos); _mv.y = 0;
  const dist = _mv.length();
  if(dist > 0.08 && dt > 0){
    const step = Math.min(dist, 5.2 * dt);
    P.pos.addScaledVector(_mv.normalize(), step);
    P.moving = Math.min(1, P.moving + dt*6);
    const want = Math.atan2(_mv.x, _mv.z);
    let d = want - P.face;
    while(d > Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    P.face += d * Math.min(1, dt*14);
  } else P.moving = Math.max(0, P.moving - dt*6);

  player.position.copy(P.pos);
  player.rotation.y = P.face;
  playerBody.position.y = Math.abs(Math.sin(now*9)) * 0.05 * P.moving;
  playerBody.rotation.z = Math.sin(now*9) * 0.03 * P.moving;
  playerRing.position.set(P.pos.x, 0.02, P.pos.z);
  playerRing.material.opacity = 0.35 + Math.sin(now*2.4)*0.1;

  // 更新队列
  for(let i = updaters.length-1; i >= 0; i--){
    const u = updaters[i];
    if(u.dead){ updaters.splice(i,1); continue; }
    u.update(dt);
    if(u.dead) updaters.splice(i,1);
  }

  // 粒子
  for(const k in POOLS) POOLS[k].update(dt);
  legPool.update(dt);

  // 贴花淡出
  DECAL.list.forEach(d=>{
    if(d.life >= 0 && d.m.visible){
      d.life += dt;
      const k = d.life / d.max;
      if(k >= 1){ d.m.visible = false; }
      else d.m.material.opacity = Math.min(1, (1-k)*1.6) * 0.92 * Math.min(1, d.life*6);
    }
  });

  // 木人桩
  enemies.forEach((e, i)=>{
    if(e.hitT > 0){
      e.hitT -= raw;
      e.mat.emissiveIntensity = Math.max(0, e.hitT/0.2) * 0.55;
      if(e.hitT <= 0) e.mat.emissiveIntensity = 0;
    }
    if(e.deadT > 0){
      e.deadT -= raw;
      const k = Math.max(0, e.deadT/1.2);
      e.g.scale.setScalar(0.6 + k*0.4);
      e.g.position.y = -0.6*(1-k);
      e.g.rotation.z = (1-k) * 0.6;
      if(e.deadT <= 0){ e.g.scale.setScalar(1); e.g.position.y = 0; e.g.rotation.z = 0; }
    } else {
      e.pos.lerp(e.home, Math.min(1, raw*2.4));
      e.g.position.x = e.pos.x;
      e.g.position.z = e.pos.z;
      e.g.position.y = Math.sin(now*1.6 + e.phase) * 0.02;
      e.g.rotation.y = Math.sin(now*0.8 + e.phase) * 0.1;
      e.mark.position.set(e.pos.x, 0.012, e.pos.z);
      e.mark.material.opacity = 0.22 + Math.sin(now*2 + e.phase)*0.08;
      e.mark.scale.setScalar(1.1 + Math.sin(now*2 + e.phase)*0.04);
    }
  });

  // buff
  updateBuffs(raw);
  if(toastT > 0){ toastT -= raw; if(toastT <= 0 && toastEl) toastEl.style.opacity = 0; }

  // 相机抖动
  if(shakeState.t < shakeState.dur){
    shakeState.t += raw;
    const k = Math.max(0, 1 - shakeState.t / shakeState.dur);
    const a = shakeState.amp * k * k;
    camera.position.set(
      CAM.base.x + (Math.random()-0.5) * a * 1.6,
      CAM.base.y + (Math.random()-0.5) * a * 1.2,
      CAM.base.z + (Math.random()-0.5) * a * 1.6
    );
  } else {
    camera.position.copy(CAM.base);
  }
  camera.lookAt(0, 0.9, 0);

  // billboard
  billboards.forEach(m=>{ if(!m.userData.noBB) m.quaternion.copy(camera.quaternion); });

  // 自动巡演
  if(opts.auto && !TIME.pause){
    autoT += raw;
    if(autoT > 2.4){
      autoT = 0;
      const keys = CLASSES[curClass].keys;
      const k = keys[autoIdx++ % keys.length];
      selectSkill(k);
    }
  }

}

function frame(ts){
  requestAnimationFrame(frame);
  if(FROZEN){ renderer.render(scene, camera); return; }
  const raw = Math.min(0.05, Math.max(0.001, (ts - lastT) / 1000));
  lastT = ts;
  simulate(raw);
  renderer.render(scene, camera);

  // 性能面板
  frameCount++;
  perfT += raw;
  if(perfT > 0.4){
    document.getElementById('pfps').textContent = Math.round(frameCount / perfT);
    document.getElementById('ppart').textContent = totalParticles();
    document.getElementById('pdc').textContent = renderer.info.render.calls;
    document.getElementById('preb').textContent = Math.round(rebuilds / perfT);
    rebuilds = 0;
    frameCount = 0; perfT = 0;
  }
}
// 确定性地推进模拟（用于截图/回归检查）
window.__step = (sec)=>{
  let left = sec;
  while(left > 0){ const d = Math.min(1/60, left); simulate(d); left -= d; }
  renderer.render(scene, camera);
  return { particles: totalParticles(), updaters: updaters.length };
};
updatePointScale();
requestAnimationFrame(frame);

/* =====================================================================
   13. 面板交互
   ===================================================================== */
const segElem = document.getElementById('segElem');
segElem.innerHTML = '';
Object.keys(ELEMS).forEach(k=>{
  const b = document.createElement('button');
  b.className = 'elem' + (k === curElem ? ' on' : '');
  b.dataset.v = k;
  b.textContent = ELEMS[k].name;
  const hex = '#' + ELEMS[k].glow.toString(16).padStart(6,'0');
  if(k === curElem){ b.style.background = hex; b.style.color = '#0a0a0a'; }
  b.onclick = ()=>{
    curElem = k;
    segElem.querySelectorAll('button').forEach(x=>{
      const on = x.dataset.v === k;
      x.classList.toggle('on', on);
      x.style.background = on ? '#' + ELEMS[x.dataset.v].glow.toString(16).padStart(6,'0') : 'rgba(255,255,255,.02)';
      x.style.color = on ? '#0a0a0a' : '';
    });
    FX.enchant(true, C(ELEMS[k].glow));
  };
  segElem.appendChild(b);
});

document.getElementById('segMode').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  mode = b.dataset.v;
  document.querySelectorAll('#segMode button').forEach(x=>x.classList.toggle('on', x === b));
  syncPanel();
});
document.getElementById('segSpeed').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  TIME.scale = parseFloat(b.dataset.v);
  document.querySelectorAll('#segSpeed button').forEach(x=>x.classList.toggle('on', x === b));
});
document.querySelectorAll('.cmbtn').forEach(b=>{
  b.onclick = ()=> COMBOS[b.dataset.cm] ? COMBOS[b.dataset.cm]() : 0;
});
document.getElementById('optOld').onchange = (e)=>{
  opts.old = e.target.checked;
  document.getElementById('oldhud').classList.toggle('hidden', !opts.old);
  if(!opts.old) document.getElementById('oldhud').innerHTML = '';
};
document.getElementById('optAuto').onchange = (e)=>{ opts.auto = e.target.checked; autoT = 99; };
document.getElementById('optSlowmo').onchange = (e)=>{ opts.slowmo = e.target.checked; };
document.getElementById('panelBtn').onclick = ()=>{
  document.getElementById('panel').classList.toggle('collapsed');
};
if(innerWidth <= 760) document.getElementById('panel').classList.add('collapsed');

// A/B 连播：先用旧实现放一遍，1.7s 后换新实现再放一遍
let abT = null;
document.getElementById('btnAB').onclick = ()=>{
  const k = panelSkill;
  const restore = mode;
  const syncMode = (m)=>document.querySelectorAll('#segMode button').forEach(b=>b.classList.toggle('on', b.dataset.v === m));
  clearTimeout(abT);
  mode = 'legacy'; syncMode('legacy');
  CD_SWEEP[k] = 0; cast(k);
  toast('旧实现');
  abT = setTimeout(()=>{
    mode = 'v2'; syncMode('v2');
    CD_SWEEP[k] = 0; cast(k);
    toast('新实现 · 同一个技能');
    abT = setTimeout(()=>{ mode = restore; syncMode(restore); }, 2600);
  }, 1700);
};

document.querySelectorAll('#tabs button').forEach(b=>{
  b.onclick = ()=>{
    curClass = b.dataset.c;
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x===b));
    renderBar();
    panelSkill = CLASSES[curClass].keys[0];
    syncPanel();
    document.getElementById('portrait').textContent = CLASSES[curClass].icon;
  };
});

// 技能槽：悬停看说明，点击释放
barEl.addEventListener('mouseover', e=>{
  const s = e.target.closest('.slot'); if(!s) return;
  if(panelSkill !== s.dataset.k){ panelSkill = s.dataset.k; syncPanel(); }
});

renderBar();
panelSkill = 'whirl';
syncPanel();

// 开场
const introEl = document.getElementById('intro');
document.getElementById('startBtn').onclick = ()=>{
  introEl.classList.add('gone');
  setTimeout(()=>introEl.remove(), 600);
  FX.enchant(true, C(ELEMS[curElem].glow));
  // 开场演一遍旋风斩（URL 指定技能时不抢戏）
  if(!new URLSearchParams(location.search).get('skill')) setTimeout(()=>selectSkill('whirl'), 260);
  setTimeout(()=>{ addBuff('bloodrage', 12); addBuff('stance', 6, 3); }, 420);
};

// 初始 buff 演示
addBuff('stance', 12, 3);
addBuff('heal', 10);

// 全局错误兜底（调试用，也会写进标题方便无头浏览器抓取）
addEventListener('error', (e)=>{
  document.title = 'ERR: ' + (e.message || 'unknown');
  console.error('[VFX]', e.message, e.filename, e.lineno);
});

// URL 参数：?start=1&skill=meteor&mode=v2&elem=fire&speed=1&q=1
const qs = new URLSearchParams(location.search);
if(qs.get('mode')){
  mode = qs.get('mode');
  document.querySelectorAll('#segMode button').forEach(b=>b.classList.toggle('on', b.dataset.v === mode));
}
if(qs.get('old') === '1'){
  opts.old = true;
  document.getElementById('oldhud').classList.remove('hidden');
  document.getElementById('optOld').checked = true;
}
if(qs.get('elem') && ELEMS[qs.get('elem')]){ curElem = qs.get('elem'); FX.enchant(true, C(ELEMS[curElem].glow)); }
if(qs.get('speed')) TIME.scale = parseFloat(qs.get('speed'));
if(qs.get('q')) quality = parseFloat(qs.get('q'));
if(qs.get('start') === '1'){
  const sk = qs.get('skill');
  const tt = qs.get('t');
  if(tt){
    // 确定性步进模式：直接跳过开场，放一次技能后推进 t 秒并冻结
    introEl.remove();
    FX.enchant(true, C(ELEMS[curElem].glow));
    addBuff('bloodrage', 12);
    addBuff('stance', 14, 3);
    addBuff('heal', 10);
    if(qs.get('combo') && COMBOS[qs.get('combo')]) COMBOS[qs.get('combo')]();
    else selectSkill(sk || 'whirl');
    window.__step(parseFloat(tt));
    FROZEN = true;
  } else {
    document.getElementById('startBtn').click();
    if(sk && SKILLS[sk]) setTimeout(()=>selectSkill(sk), 500);
  }
}
console.log('[VFX Playground] ready');
